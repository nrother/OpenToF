name: opentof_app
description: "OpenToF companion app for trampoline time-of-flight sensor"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_blue_plus: ^2.3.12
  audioplayers: ^6.8.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  flutter_foreground_task: ^11.0.3
  intl: ^0.20.3
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/images/OpenToF_logo_wordmark.png
    - assets/images/OpenToF_mark.png

# Branding (see tool/generate_branding.ps1). Regenerate native files with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121318" # dark surface of the app theme (seed #0052EE)
  image: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#121318"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#121318"
  web: false
